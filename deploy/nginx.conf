# 放到 /etc/nginx/conf.d/auto-response.conf，把 bot.example.com 换成你的域名
server {
    listen 80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.example.com;

    # 阿里云 数字证书管理服务 → 免费证书，下载 Nginx 格式
    ssl_certificate     /etc/nginx/cert/bot.example.com.pem;
    ssl_certificate_key /etc/nginx/cert/bot.example.com.key;

    client_max_body_size 2g;          # 安装包上传
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # Agent 长轮询
    }
}
